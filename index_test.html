<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Astroturf Image Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>AstroTurf Image Collection</h1>
    <p>Repository for SuperNova and other Astronomical Images</p>
    <div class="gallery" id="gallery"></div>

    <script>
    fetch("images_collection.json")
      .then(response => response.json())
      .then(images => {
        const gallery = document.getElementById("gallery");
        images.forEach(file => {
          const lastDot = file.lastIndexOf(".");
          let name = file;
          let ext = "";
          if (lastDot !== -1) {
            name = file.substring(0, lastDot);
            ext = file.substring(lastDot).toLowerCase();
          }

          const normalizedFile = name + ext;

          const container = document.createElement("div");
          container.classList.add("image-container");

          const label = document.createElement("div");
          label.classList.add("image-label");
          label.textContent = name;
          container.appendChild(label);

          const a = document.createElement("a");
          a.href = "images/" + encodeURIComponent(normalizedFile);
          a.target = "_blank";

          const img = document.createElement("img");
          img.src = "images/" + encodeURIComponent(normalizedFile);
          img.alt = name;

          a.appendChild(img);
          container.appendChild(a);

          gallery.appendChild(container);
        });
      })
      .catch(error => console.error("Error loading image list:", error));
    </script>

    <p>Images are available for embedding. Example:</p>
    <code>&lt;img src="https://movo-doo.github.io/astroturf/images/AT2026dix.jpg"&gt;</code>
</body>
</html>
