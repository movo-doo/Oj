<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Astronomy Image Collection</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #eee; text-align: center; }
        h1 { margin-top: 1em; }
        .gallery {
            display: flex;
            flex-wrap: wrap;       /* allows multiple rows */
            gap: 15px;             /* spacing between images */
        }

        .gallery a {
            width: 23%;            /* controls thumbnail size */
        }

        .gallery img {
            width: 100%;           /* fills the anchor box */
            height: auto;
            border: 1px solid #aaa;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>My Astronomy Image Collection</h1>
    <p>Repository for SuperNova and other Astronomical Images</p>
    <div class="gallery" id="gallery"></div>

    <script>

    fetch("images_collection.json")
      .then(response => response.json())
      .then(images => {
        const gallery = document.getElementById("gallery");
        files.forEach(file => {
          // Split filename into name and extension
          const lastDot = file.lastIndexOf(".");
          let name = file;
          let ext = "";
          if (lastDot !== -1) {
            name = file.substring(0, lastDot);
            ext = file.substring(lastDot).toLowerCase(); // lowercase extension
          }

          const normalizedFile = name + ext;

          // Create container for image + label
          const container = document.createElement("div");
          container.classList.add("image-container");

          // Create label above image
          const label = document.createElement("div");
          label.classList.add("image-label");
          label.textContent = name;  // alt value / filename without extension
          container.appendChild(label);

          // Create link and image
          const a = document.createElement("a");
          a.href = "images/" + encodeURIComponent(normalizedFile);
          a.target = "_blank";

          const img = document.createElement("img");
          img.src = "images/" + encodeURIComponent(normalizedFile);
          img.alt = name;

          a.appendChild(img);
          container.appendChild(a);

          gallery.appendChild(container);
        });
      })
      .catch(error => console.error("Error loading image list:", error));
    </script>
    </div>
    <p>Images are available for embedding. Example:</p>
    <code>&lt;img src="https://movo-doo.github.io/astroturf/images/AT2026dix.jpg"&gt;</code>
</body>
</html>
